name: Release

# Creates a GitHub release (and tag) automatically whenever the version in
# manifest.json changes on main. HACS / the Marketplace then shows a proper version.
on:
  push:
    branches: [main]
    paths: [custom_components/autodarts/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(jq -r .version custom_components/autodarts/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION exists"
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes --target "$GITHUB_SHA"
          fi
