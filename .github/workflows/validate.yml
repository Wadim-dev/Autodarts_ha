name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        timeout-minutes: 4
        run: |
          for i in 1 2 3; do
            sudo timeout 70 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -q && \
            sudo timeout 90 apt-get install -y -q --no-install-recommends ffmpeg && break
            sleep 5
          done
          ffmpeg -version | head -1
      - run: pip install -r requirements_test.txt
      - run: pytest --cov=custom_components.autodarts --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt ruff mypy
      - run: ruff check custom_components tests
      - run: mypy
