spiel_starten:
  name: Spiel starten
  description: Startet ein lokales Spiel (X01, Cricket, Training oder Partyspiel). Ohne Angaben gelten die letzten Einstellungen.
  fields: &startfelder
    spiel:
      name: Spielart
      description: "x01; Cricket: cricket, wild_mouse, mickey; Training: atc (Rund um die Uhr), bobs27, doppel, checkout121, checkout, catch40, jdc, singles; Party: highscore (Count-Up), shanghai, killer, halve_it, golf, baseball, bermuda, rtw (Round the World), gotcha, nine_lives, football, scram (genau 2 Spieler)"
      example: cricket
      selector:
        select:
          options: ["x01", "cricket", "wild_mouse", "mickey", "atc", "bobs27", "doppel", "checkout121", "checkout", "catch40", "jdc", "singles", "highscore", "shanghai", "killer", "halve_it", "golf", "baseball", "bermuda", "rtw", "gotcha", "nine_lives", "football", "scram"]
    variante:
      name: Variante
      description: "Cricket: standard, cut_throat, no_score. Wild Mouse: ohne_3b. Rund um die Uhr: single, double, triple. Round the World: auf, ab, zufall. Bermuda: ohne_halbieren. Gotcha: straight, double, master (Finish)."
      example: cut_throat
      selector:
        text:
    zahlen:
      name: Cricket-Zahlen
      description: classic (15–20, Bull), tactics (10–20, Bull), random (6 zufällige Zahlen, Bull), hidden (6 verdeckte Zahlen, Bull)
      selector:
        select:
          options: ["classic", "tactics", "random", "hidden"]
    runden:
      name: Runden
      description: "Count-Up, 121 und Checkout-Training: Anzahl Runden. Shanghai: 7 oder 20. Golf: 9 oder 18 Löcher."
      selector:
        number:
          min: 0
          max: 30
    leben:
      name: Leben (Killer, Nine Lives)
      selector:
        number:
          min: 1
          max: 9
    zielwert:
      name: Ziel
      description: "Gotcha: Zielpunkte (101–1001, Standard 301). Fußball: Tore zum Sieg (Standard 10)."
      selector:
        number:
          min: 0
          max: 1001
    spieler:
      name: Spieler
      description: Liste aus Spieler-IDs (siehe sensor.autodarts_board_spieler), Bots als bot:55 (Average) und Teams als team:id1+id2 (werfen abwechselnd). Höchstens 8.
      example: '["a1b2c3d4", "bot:55"]'
      selector:
        object:
    startwert:
      name: Startwert
      example: 501
      selector:
        select:
          options: ["101", "170", "301", "501", "701", "901"]
    einwurf:
      name: Einwurf
      selector:
        select:
          options: ["straight", "double", "master"]
    auswurf:
      name: Auswurf
      selector:
        select:
          options: ["straight", "double", "master"]
    legs:
      name: Legs (Erster bis)
      selector:
        number:
          min: 1
          max: 21
    sets:
      name: Sets (Erster bis, 0 = ohne)
      selector:
        number:
          min: 0
          max: 13
    bull_off:
      name: Bull-Off
      selector:
        boolean:
    bull_5050:
      name: 50/50 Bull (X01)
      description: Das äußere Bull (25) zählt wie das Bullseye 50 Punkte.
      selector:
        boolean:
    max_runden:
      name: Rundenlimit (X01, 0 = ohne)
      description: Nach so vielen Aufnahmen gewinnt das Leg, wer den niedrigsten Rest hat.
      selector:
        number:
          min: 0
          max: 50
    handicap:
      name: Handicap (X01)
      description: "Eigener Startwert je Spieler, z. B. {\"<spieler-id>\": 301}. Der Schlüssel ist der Eintrag aus „spieler“."
      selector:
        object:
turnier_starten:
  name: Turnier starten
  description: "Turnier mit Bots erlaubt. Gleiche Felder wie beim Spiel, dazu turnier_modus: ko (K.-o., 3–32 Spieler), doppel_ko (Doppel-K.-o., 3–16), gruppen (Gruppen + K.-o., 6–32) oder liga (jeder gegen jeden, 3–10). Jedes Match wird mit diesen Einstellungen gespielt, Freilose werden automatisch verteilt."
  fields: *startfelder
turnier_weiter:
  name: Turnier weiter
  description: Startet das nächste Match des laufenden Turniers.
turnier_abbrechen:
  name: Turnier abbrechen
  description: Beendet das Turnier (ein laufendes Match wird normal zu Ende gespielt).
spiel_abbrechen:
  name: Spiel abbrechen
  description: Beendet das Spiel ohne Wertung (nach Spielende zurück zur Auswahl).
weiter:
  name: Weiter
  description: Aufnahme beenden, nächster Spieler (fehlende Darts zählen als Fehlwurf).
rueckgaengig:
  name: Rückgängig
  description: Letzten Dart zurücknehmen.
wurf_aendern:
  name: Wurf ändern
  description: Dart korrigieren, nachtragen oder löschen.
  fields:
    aufnahme:
      name: Aufnahme
      description: Nummer der Aufnahme (leer = aktuelle).
      selector:
        number:
          min: 0
          max: 9999
          mode: box
    dart:
      name: Dart
      description: 0, 1 oder 2
      required: true
      selector:
        number:
          min: 0
          max: 2
    feld:
      name: Feld
      description: z. B. T20, D16, S5, 25, Bull, M; leer = löschen
      selector:
        text:
spieler_anlegen:
  name: Spieler anlegen
  fields:
    name:
      name: Name
      required: true
      selector:
        text:
spieler_aendern:
  name: Spieler ändern
  description: Umbenennen oder löschen (löscht auch seine Statistik).
  fields:
    id:
      name: Spieler-ID
      required: true
      selector:
        text:
    name:
      name: Neuer Name
      selector:
        text:
    loeschen:
      name: Löschen
      selector:
        boolean:
statistik_loeschen:
  name: Statistik löschen
  description: Statistik eines Spielers (oder aller) und auf Wunsch den Spielverlauf löschen.
  fields:
    id:
      name: Spieler-ID (leer = alle)
      selector:
        text:
    verlauf:
      name: Spielverlauf auch löschen
      selector:
        boolean:
strom_setzen:
  name: Steckdose des Board-PCs
  description: Steckdose, an der der Board-PC hängt. Alle DartNest-Karten (auch die Seitenleiste) zeigen dann den Ein/Aus-Knopf. Leer lassen entfernt sie. Die Karte „Board Manager“ macht das per Klick.
  fields:
    schalter:
      name: Steckdose
      example: switch.darts_steckdose
      selector:
        entity:
          domain: switch
    leistung:
      name: Leistungsmesser (optional)
      description: Leistung der Steckdose in Watt; damit erkennt DartNest, wann der PC wirklich aus ist.
      selector:
        entity:
          domain: sensor
          device_class: power
    einschalten:
      name: Einschalten mit (optional)
      description: Statt nur die Steckdose einzuschalten, z. B. ein Skript.
      selector:
        entity:
          domain: [script, button, input_button, automation, switch, scene]
    ausschalten:
      name: Ausschalten mit (optional)
      description: z. B. ein Skript, das den PC erst herunterfährt und dann die Steckdose ausschaltet. Ohne wird die Steckdose direkt ausgeschaltet.
      selector:
        entity:
          domain: [script, button, input_button, automation, switch]
    pc_online:
      name: PC läuft (optional)
      description: Sensor, der an ist, solange der Board-PC läuft.
      selector:
        entity:
          domain: binary_sensor
fernseher_zeigen:
  name: Darts auf dem Fernseher zeigen
  description: Startet die DartNest-Fernseher-Seite (Spielstand, sonst Uhr und Rangliste) auf Fire TV, Google TV oder Chromecast. Ohne Angabe die Fernseher aus den DartNest-Einstellungen.
  fields:
    geraete:
      name: Fernseher (optional)
      selector:
        entity:
          domain: media_player
          multiple: true
fernseher_beenden:
  name: Darts vom Fernseher nehmen
  description: Schließt die DartNest-Seite auf dem Fernseher (Fire/Google TV gehen zum Startbildschirm, Chromecast beendet die Anzeige).
  fields:
    geraete:
      name: Fernseher (optional)
      selector:
        entity:
          domain: media_player
          multiple: true
fernseher_setzen:
  name: Fernseher für Darts einstellen
  description: Welche Fernseher DartNest nutzt und ob die Anzeige beim Spielstart von selbst startet. Die Karte „DartNest-Einstellungen“ macht das per Klick.
  fields:
    geraete:
      name: Fernseher
      selector:
        entity:
          domain: media_player
          multiple: true
    auto:
      name: Beim Spielstart von selbst zeigen
      selector:
        boolean:
    neuer_link:
      name: Neuen Link erzeugen
      description: Der alte Link der Fernseher-Seite funktioniert dann nicht mehr.
      selector:
        boolean:
    brett:
      name: Dartscheibe zeigen
      description: Neben dem Spielstand die Dartscheibe mit den Darts der Aufnahme zeigen.
      selector:
        boolean:
    ansicht:
      name: Ansicht der Dartscheibe
      description: Gezeichnete Scheibe oder das gerade gerückte Bild einer Board-Kamera (solange die Erkennung läuft, sonst die gezeichnete).
      selector:
        select:
          options:
            - label: Gezeichnete Scheibe
              value: graphic
            - label: Kamera 1
              value: camera_1
            - label: Kamera 2
              value: camera_2
            - label: Kamera 3
              value: camera_3
lichteffekte_setzen:
  name: Lichteffekte speichern
  description: >-
    Alle Regeln der Lichteffekte auf einmal setzen (ersetzt die bisherigen). Jede Regel:
    ereignis (z. B. one_eighty, bust, checkout, leg_won), lichter (Liste light.*),
    effekt (farbe, blinken, blitz, pulsieren, herzschlag, stroboskop, ausblenden, wechsel, regenbogen, welle, konfetti, lauflicht, funkeln, polizei, feuer, gewitter, lampe, preset), farbe [r, g, b], farbe2 (bei wechsel), helligkeit 1–100,
    dauer 1–60 s, aktiv; bei lampe lampen_effekt, tempo/staerke 0–255 (WLED), bei preset preset. Die Karte „DartNest Lichteffekte“ macht das per Klick.
  fields:
    regeln:
      name: Regeln
      required: true
      example: '[{"ereignis": "one_eighty", "lichter": ["light.flur"], "effekt": "regenbogen", "dauer": 5}]'
      selector:
        object:
lichteffekt_testen:
  name: Lichteffekt testen
  description: Einen Lichteffekt sofort einmal abspielen, ohne ihn zu speichern.
  fields:
    regel:
      name: Regel
      required: true
      example: '{"ereignis": "one_eighty", "lichter": ["light.flur"], "effekt": "blinken", "farbe": [255, 200, 0]}'
      selector:
        object:
ansager_setzen:
  name: Ansager einstellen
  description: >-
    Einstellungen des Ansagers speichern: aktiv, lautsprecher (Liste media_player.*), stimme (tts.*),
    pack (Ordner unter Medien autodarts/caller), punkte, rest, ende, besondere, game_on, walkon,
    walkon_sekunden 5–60, songs (Spieler-ID → Datei in autodarts/walkon). Die Karte „DartNest Ansager“ macht das per Klick.
  fields:
    einstellungen:
      name: Einstellungen
      required: true
      example: '{"aktiv": true, "lautsprecher": ["media_player.kueche"]}'
      selector:
        object:
ansager_testen:
  name: Ansager testen
  description: Einmal etwas über die gewählten Lautsprecher ansagen.
  fields:
    text:
      name: Text
      example: Einhundertachtzig!
      selector:
        text:
    sprecher:
      name: Sprecher
      description: Nur mit Google AI – Probe mit diesem Sprecher (z. B. fenrir, puck).
      example: puck
      selector:
        text:
ansager_pack_anhalten:
  name: Ansager-Pack anhalten
  description: Hält das Erzeugen eines Packs an. Fertige Töne bleiben, es geht nicht mehr von selbst weiter.
ansager_pack_erzeugen:
  name: Ansager-Pack erzeugen
  description: >-
    Spricht alle Punkte (0–180), „du brauchst“, Game shot, Leg, Satz, Match und die Spielernamen einmal mit der
    gewählten Stimme und speichert sie als Pack (Medien autodarts/caller/<name>). Mit Google AI im Stil eines
    WM-Ansagers. Läuft im Hintergrund, vorhandene Dateien bleiben (fortsetzbar). Die Ansager-Karte macht das per Klick.
  fields:
    name:
      name: Name
      example: Meisterschaft
      selector:
        text:
    sprecher:
      name: Sprecher
      description: Stimme der Google-AI-Sprachausgabe, z. B. fenrir, algenib, puck.
      example: fenrir
      selector:
        text:
    nur:
      name: Nur
      description: Nur diese Dateien (z. B. 180, 140, require, leg).
      selector:
        text:
          multiple: true
    neu:
      name: Neu
      description: Vorhandene Dateien neu sprechen (z. B. nach Wechsel des Sprechers).
      selector:
        boolean:
ansager_pack_pruefen:
  name: Ansager-Pack prüfen
  description: Sucht in den Tönen eines Packs eine mitgesprochene Anweisung (z. B. „Say loudly …“) und schneidet sie ab. Töne, bei denen das nicht geht, werden entfernt und beim nächsten Erzeugen neu gesprochen. Originale bleiben im Unterordner _original.
  fields:
    name:
      name: Name
      required: true
      example: Meisterschaft Fenrir
      selector:
        text:
    reparieren:
      name: Reparieren
      description: Aus = nur prüfen und berichten.
      default: true
      selector:
        boolean:
    anhoeren:
      name: Anhören
      description: >-
        Hört jeden Punkte-Ton mit der Spracherkennung von Home Assistant an (z. B. Home Assistant Cloud). Töne, die
        nicht ihre Zahl sagen, werden im Hintergrund neu gesprochen; bis dahin spielt der alte Ton. Passiert für
        Meisterschafts-Packs auch einmal von selbst.
      default: false
      selector:
        boolean:
ansager_pack_loeschen:
  name: Ansager-Pack löschen
  description: Löscht ein Pack (Ordner unter Medien autodarts/caller). Die Ansager-Karte macht das per Klick.
  fields:
    name:
      name: Name
      required: true
      example: Meisterschaft Fenrir
      selector:
        text:
clips_setzen:
  name: Highlight-Clips einstellen
  description: Bei Highlights (180, Finish ab 100, Matchdart …) die letzten Sekunden der Board-Kamera als kurzes Video speichern (Medien → dartnest/clips). Die Karte „DartNest Highlights“ macht das per Klick.
  fields:
    an:
      name: Clips aufnehmen
      selector:
        boolean:
    kamera:
      name: Kamera
      selector:
        select:
          options:
            - label: Kamera 1
              value: camera_1
            - label: Kamera 2
              value: camera_2
            - label: Kamera 3
              value: camera_3
    anlaesse:
      name: Anlässe
      selector:
        select:
          multiple: true
          options:
            - label: "180"
              value: one_eighty
            - label: Finish ab 100
              value: high_finish
            - label: Matchdart
              value: match_won
            - label: Leg gewonnen
              value: leg_won
            - label: 9-Darter
              value: nine_darter
            - label: 140 und mehr
              value: ton_forty
            - label: Jedes Finish
              value: checkout
            - label: Bullseye
              value: bullseye
            - label: Drei in einem Feld
              value: three_in_a_bed
    anzahl:
      name: Höchstens behalten
      description: Ältere Clips werden gelöscht.
      selector:
        number:
          min: 1
          max: 200
    wiederholung:
      name: Wiederholung auf Fernseher und Overlay
      selector:
        boolean:
clip_speichern:
  name: Clip speichern
  description: Die letzten Sekunden der Kamera jetzt als Clip speichern (nur während eines Spiels mit eingeschalteten Clips).
clip_loeschen:
  name: Clip löschen
  fields:
    id:
      name: Clip
      selector:
        text:
    alle:
      name: Alle Clips löschen
      selector:
        boolean:
aufnahme_eintragen:
  name: Aufnahme eintragen
  description: >-
    Eine ganze Aufnahme mit ihrer Punktzahl eintragen (nur X01), z. B. per Sprache „Alex hat 140“.
    Ist die Zahl genau der Rest, gilt sie als Checkout.
  fields:
    spieler:
      name: Spieler
      description: Name des Spielers, der dran ist (leer = wer dran ist).
      example: Alex
      selector:
        text:
    punkte:
      name: Punkte
      required: true
      example: 140
      selector:
        number:
          min: 0
          max: 180
pixel_setzen:
  name: Pixel-Anzeigen einstellen
  description: Spielstand und Effekte auf AWTRIX-3- und PixelIt-Anzeigen. Die Karte „DartNest Pixel-Anzeige“ macht das per Klick.
  fields:
    an:
      name: Spielstand zeigen
      selector:
        boolean:
    effekte:
      name: Effekte (180, Checkout, Bust, Sieg)
      selector:
        boolean:
pixel_hinzufuegen:
  name: Pixel-Anzeige hinzufügen
  description: AWTRIX 3 oder PixelIt über die IP-Adresse hinzufügen; die Art wird selbst erkannt.
  fields:
    adresse:
      name: Adresse
      required: true
      example: 192.168.178.50
      selector:
        text:
pixel_entfernen:
  name: Pixel-Anzeige entfernen
  fields:
    adresse:
      name: Adresse
      required: true
      example: 192.168.178.50
      selector:
        text:
pixel_testen:
  name: Pixel-Anzeige testen
  description: Zeigt einen Gruß auf einer Anzeige (Adresse) oder allen.
  fields:
    adresse:
      name: Adresse
      example: 192.168.178.50
      selector:
        text:
